# Vault Management Configuration
# 
# This file contains default configuration values for the vault management system.
# Environment variables can override these defaults.
#
# Author: Local Development Team
# Version: 1.0
# Date: 2025-01-18

# Vault Configuration
VAULT_IMAGE_PATH="${HOME}/JournalsVault.sparseimage"
VAULT_MOUNT_POINT="${HOME}/Journals"
VAULT_SIZE="10g"

# Security Configuration
VAULT_ENCRYPTION="AES-256"
VAULT_FILESYSTEM="APFS"
VAULT_MIN_PASSPHRASE_LENGTH=8

# Logging Configuration
LOG_LEVEL="INFO"
LOG_FILE="/tmp/vault-manager.log"
LOG_MAX_SIZE="10MB"
LOG_RETENTION_DAYS=7

# Performance Configuration
VAULT_CREATE_TIMEOUT=300
VAULT_MOUNT_TIMEOUT=60
VAULT_UNMOUNT_TIMEOUT=30

# Testing Configuration
TEST_VAULT_PATH="/tmp/test-journal-vault.sparseimage"
TEST_MOUNT_POINT="/tmp/test-journal-mount"
TEST_VAULT_SIZE="1g"

# Error Handling Configuration
CLEANUP_ON_ERROR=true
ROLLBACK_ON_FAILURE=true
VERIFY_OPERATIONS=true

# Security Constraints
NEVER_LOG_PASSPHRASES=true
NEVER_STORE_PASSPHRASES=true
VERIFY_ENCRYPTION=true
CHECK_MOUNT_SECURITY=true
