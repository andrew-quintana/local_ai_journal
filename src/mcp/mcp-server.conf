# MCP Server Configuration for Vault Access
# 
# This configuration file defines settings for the MCP server that provides
# vault access tools to LLM agents.
#
# Author: Local Development Team
# Version: 1.0
# Date: 2025-01-18

# Vault Configuration
VAULT_PATH="/journals"
VAULT_MOUNT_POINT="/journals"

# Security Configuration
ALLOWED_EXTENSIONS=".md,.markdown,.txt,.json"
MAX_FILE_SIZE_MB=10
ENABLE_WRITE_ACCESS=true
WRITE_ALLOWED_EXTENSIONS=".md,.markdown"

# MCP Server Configuration
MCP_SERVER_NAME="vault-mcp-server"
MCP_SERVER_VERSION="1.0.0"
MCP_SERVER_PORT=8082
MCP_SERVER_HOST="127.0.0.1"

# Logging Configuration
LOG_LEVEL="INFO"
LOG_FILE="/tmp/vault-mcp-server.log"
LOG_MAX_SIZE="10MB"
LOG_RETENTION_DAYS=7

# Performance Configuration
MAX_CONCURRENT_REQUESTS=10
REQUEST_TIMEOUT_SECONDS=30
CACHE_ENABLED=true
CACHE_TTL_SECONDS=300

# Security Constraints
ENABLE_PATH_VALIDATION=true
ENABLE_FILE_SIZE_LIMITS=true
ENABLE_EXTENSION_FILTERING=true
ENABLE_WRITE_RESTRICTIONS=true

# Tool Configuration
ENABLE_LIST_TOOLS=true
ENABLE_READ_TOOLS=true
ENABLE_SEARCH_TOOLS=true
ENABLE_WRITE_TOOLS=true
ENABLE_METADATA_TOOLS=true

# Error Handling
ENABLE_DETAILED_ERRORS=false
ENABLE_STACK_TRACES=false
ENABLE_SECURITY_LOGGING=true

