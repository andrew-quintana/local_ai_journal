# Docker Orchestration Configuration
# 
# This file contains default configuration values for the Docker orchestration system.
# Environment variables can override these defaults.
#
# Author: Local Development Team
# Version: 1.0
# Date: 2025-01-18

# Docker Configuration
DOCKER_COMPOSE_FILE="${PROJECT_ROOT}/src/docker/docker-compose.yml"
DOCKER_NETWORK_NAME="journals-internal"
DOCKER_PROJECT_NAME="journals"

# Service Ports
OLLAMA_PORT="11434"
WEBUI_PORT="3000"

# Health Check Configuration
HEALTH_CHECK_TIMEOUT=120
HEALTH_CHECK_INTERVAL=30
HEALTH_CHECK_RETRIES=3
HEALTH_CHECK_START_PERIOD=40

# Graceful Shutdown Configuration
GRACEFUL_SHUTDOWN_TIMEOUT=30
FORCE_SHUTDOWN_TIMEOUT=5

# Resource Limits
OLLAMA_MEMORY_LIMIT="4G"
OLLAMA_CPU_LIMIT="2.0"
OLLAMA_MEMORY_RESERVATION="2G"
OLLAMA_CPU_RESERVATION="1.0"

WEBUI_MEMORY_LIMIT="2G"
WEBUI_CPU_LIMIT="1.0"
WEBUI_MEMORY_RESERVATION="1G"
WEBUI_CPU_RESERVATION="0.5"

# Security Configuration
DOCKER_USER="1000:1000"
DOCKER_READ_ONLY=true
DOCKER_NO_NEW_PRIVILEGES=true
DOCKER_TMPFS_SIZE="1g"

# Network Security
BIND_TO_LOCALHOST_ONLY=true
DISABLE_EXTERNAL_NETWORK=true
VERIFY_PORT_BINDING=true

# Volume Security
JOURNALS_READ_ONLY=true
VERIFY_VOLUME_MOUNT=true
CLEANUP_ORPHANED_CONTAINERS=true

# Logging Configuration
LOG_LEVEL="INFO"
LOG_FILE="/tmp/docker-manager.log"
LOG_MAX_SIZE="10MB"
LOG_RETENTION_DAYS=7

# Performance Configuration
STARTUP_TIMEOUT=300
SHUTDOWN_TIMEOUT=60
CLEANUP_TIMEOUT=30

# Testing Configuration
TEST_CONTAINER_PREFIX="test-journals"
TEST_NETWORK_NAME="test-journals-internal"
TEST_VOLUME_PREFIX="test-journals"

# Error Handling Configuration
CLEANUP_ON_ERROR=true
ROLLBACK_ON_FAILURE=true
VERIFY_OPERATIONS=true
RETRY_FAILED_OPERATIONS=true
MAX_RETRY_ATTEMPTS=3

# Security Constraints
NEVER_BIND_EXTERNAL=true
NEVER_ALLOW_PRIVILEGED=true
NEVER_ALLOW_ROOT_USER=true
VERIFY_SECURITY_CONSTRAINTS=true
MONITOR_NETWORK_ACCESS=true
