# WebUI Security Configuration
# 
# This configuration file defines security settings for the Open WebUI
# integration with the journals infrastructure.
#
# Security Features:
# - Localhost-only binding
# - Read-only journal access
# - Disabled external integrations
# - Secure session management
# - Minimal attack surface
#
# Author: Local Development Team
# Version: 1.0
# Date: 2025-01-18

# Core WebUI Configuration
# WEBUI_PORT is set as readonly in docker-manager.sh
export WEBUI_HOST="127.0.0.1"
export WEBUI_ORIGINS="http://127.0.0.1:${WEBUI_PORT:-3000}"

# Security Keys (Generated automatically if not set)
export WEBUI_SECRET_KEY="${WEBUI_SECRET_KEY:-$(openssl rand -hex 32)}"
export WEBUI_JWT_SECRET_KEY="${WEBUI_JWT_SECRET_KEY:-$(openssl rand -hex 32)}"

# Ollama Integration
export OLLAMA_BASE_URL="http://ollama:11434"
export OLLAMA_HOST="127.0.0.1"
# OLLAMA_PORT is set as readonly in docker-manager.sh

# User Authentication
export WEBUI_DISABLE_SIGNUP="true"
export WEBUI_DISABLE_LOGIN_FORM="false"
export ENABLE_SIGNUP="false"
export ENABLE_LOGIN_FORM="true"
export ENABLE_OAUTH_SIGNUP="false"

# External API Integrations (All Disabled)
export ENABLE_OPENAI_API="false"
export ENABLE_ANTHROPIC_API="false"
export ENABLE_GOOGLE_API="false"
export ENABLE_COHERE_API="false"
export ENABLE_AZURE_OPENAI_API="false"
export ENABLE_OPENROUTER_API="false"
export ENABLE_TABBY_API="false"

# External Features (All Disabled)
export ENABLE_LOCAL_WEB_SEARCH="false"
export ENABLE_COMMUNITY_SHARING="false"
export ENABLE_MESSAGE_RATING="false"

# Admin Features (All Disabled for Security)
export ENABLE_ADMIN_EXPORT="false"
export ENABLE_ADMIN_CHAT_ACCESS="false"
export ENABLE_ADMIN_USER_MANAGEMENT="false"
export ENABLE_ADMIN_MODEL_MANAGEMENT="false"
export ENABLE_ADMIN_SYSTEM_MONITORING="false"
export ENABLE_ADMIN_ANNOUNCEMENTS="false"

# Rich Text Features (All Disabled to Reduce Attack Surface)
export ENABLE_ADMIN_ANNOUNCEMENTS_RICH_TEXT="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_MARKDOWN="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_CODE_HIGHLIGHTING="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_MATH="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_MERMAID="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_DIAGRAMS="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_TABLES="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_TASKLISTS="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_STRIKETHROUGH="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_FOOTNOTES="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_DEFINITION_LISTS="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_ABBREVIATIONS="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_SUBSCRIPTS="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_SUPERSCRIPTS="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_QUOTES="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_SMARTYPANTS="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_TYPOGRAPHER="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_ATTRIBUTES="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_CONTAINERS="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_ALERTS="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_ICONS="false"
export ENABLE_ADMIN_ANNOUNCEMENTS_EMOJI="false"

# File Upload Security
export ENABLE_FILE_UPLOAD="false"
export MAX_FILE_SIZE="0"

# Session Security
export SESSION_TIMEOUT="3600"
export JWT_EXPIRATION="3600"

# Logging Security
# LOG_LEVEL is set as readonly in docker-manager.sh
export ENABLE_DEBUG="false"

# Network Security
export WEBUI_NETWORK_ISOLATION="true"
export WEBUI_EXTERNAL_ACCESS="false"

# Container Security
export WEBUI_READ_ONLY="true"
export WEBUI_USER="1000:1000"
export WEBUI_NO_NEW_PRIVILEGES="true"

# Resource Limits
export WEBUI_MEMORY_LIMIT="2G"
export WEBUI_CPU_LIMIT="1.0"
export WEBUI_MEMORY_RESERVATION="1G"
export WEBUI_CPU_RESERVATION="0.5"

# Security Monitoring
export WEBUI_SECURITY_MONITORING="true"
export WEBUI_ACCESS_LOGGING="true"
export WEBUI_AUDIT_LOGGING="true"

# Journal Integration
export WEBUI_JOURNAL_READ_ONLY="true"
export WEBUI_JOURNAL_PATH="/journals"
export WEBUI_JOURNAL_ACCESS_MONITORING="true"

# Security Validation
export WEBUI_SECURITY_VALIDATION="true"
export WEBUI_NETWORK_ISOLATION_CHECK="true"
export WEBUI_READONLY_MOUNT_CHECK="true"
export WEBUI_CONTAINER_SECURITY_CHECK="true"

# Environment Validation
export WEBUI_ENV_VALIDATION="true"
export WEBUI_REQUIRED_VARS="WEBUI_SECRET_KEY,WEBUI_JWT_SECRET_KEY,VAULT_MOUNT_POINT"
export WEBUI_PORT_VALIDATION="true"
export WEBUI_VAULT_VALIDATION="true"

# Security Constraints
export WEBUI_ABSOLUTE_RESTRICTIONS="true"
export WEBUI_NO_WRITE_ACCESS="true"
export WEBUI_NO_EXTERNAL_ACCESS="true"
export WEBUI_NO_SENSITIVE_LOGGING="true"
export WEBUI_NO_FILE_UPLOADS="true"

# Monitoring Configuration
export WEBUI_MONITORING_INTERVAL="300"
export WEBUI_MAX_ACCESS_ATTEMPTS="100"
export WEBUI_SECURITY_CHECK_INTERVAL="300"
export WEBUI_VIOLATION_ALERT_THRESHOLD="1"

# Audit Configuration
export WEBUI_AUDIT_LOG_LEVEL="INFO"
export WEBUI_AUDIT_LOG_RETENTION="30"
export WEBUI_AUDIT_LOG_ROTATION="daily"
export WEBUI_AUDIT_LOG_COMPRESSION="true"

# Security Testing
export WEBUI_SECURITY_TESTING="true"
export WEBUI_NETWORK_ISOLATION_TEST="true"
export WEBUI_READONLY_MOUNT_TEST="true"
export WEBUI_CONTAINER_SECURITY_TEST="true"
export WEBUI_ACCESS_CONTROL_TEST="true"
export WEBUI_ENCRYPTION_TEST="true"

# Performance Security
export WEBUI_PERFORMANCE_MONITORING="true"
export WEBUI_RESOURCE_MONITORING="true"
export WEBUI_MEMORY_MONITORING="true"
export WEBUI_CPU_MONITORING="true"
export WEBUI_DISK_MONITORING="true"

# Error Handling
export WEBUI_ERROR_HANDLING="secure"
export WEBUI_ERROR_LOGGING="minimal"
export WEBUI_ERROR_RECOVERY="automatic"
export WEBUI_ERROR_NOTIFICATION="local"

# Security Headers
export WEBUI_SECURITY_HEADERS="true"
export WEBUI_CSP_HEADER="true"
export WEBUI_HSTS_HEADER="true"
export WEBUI_X_FRAME_OPTIONS="true"
export WEBUI_X_CONTENT_TYPE_OPTIONS="true"

# Session Security
export WEBUI_SESSION_SECURITY="true"
export WEBUI_SESSION_HTTPONLY="true"
export WEBUI_SESSION_SECURE="true"
export WEBUI_SESSION_SAMESITE="strict"

# Content Security
export WEBUI_CONTENT_SECURITY="true"
export WEBUI_CONTENT_VALIDATION="true"
export WEBUI_CONTENT_SANITIZATION="true"
export WEBUI_CONTENT_FILTERING="true"

# Network Security
export WEBUI_NETWORK_SECURITY="true"
export WEBUI_FIREWALL_RULES="restrictive"
export WEBUI_PORT_SCANNING="disabled"
export WEBUI_NETWORK_MONITORING="enabled"

# Data Protection
export WEBUI_DATA_PROTECTION="true"
export WEBUI_DATA_ENCRYPTION="true"
export WEBUI_DATA_ANONYMIZATION="true"
export WEBUI_DATA_RETENTION="minimal"

# Compliance
export WEBUI_COMPLIANCE_MODE="strict"
export WEBUI_PRIVACY_MODE="maximum"
export WEBUI_SECURITY_MODE="paranoid"
export WEBUI_AUDIT_MODE="comprehensive"

