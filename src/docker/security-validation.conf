# Security Validation Configuration
# 
# This configuration file defines settings for the security validation system
# including ports to check, containers to monitor, and validation thresholds.
#
# Author: Local Development Team
# Version: 1.0
# Date: 2025-01-18

# Port Configuration
# Ports to check for localhost-only binding
SECURITY_PORTS=("3000" "11435")

# Journal Configuration
# Path to journal directory for file system validation
JOURNAL_PATH="/journals"

# Container Configuration
# Containers to check for security compliance
SECURITY_CONTAINERS=("journals-webui" "journals-ollama")

# Logging Configuration
# Log level for security validation (DEBUG, INFO, WARNING, ERROR)
LOG_LEVEL="INFO"

# Monitoring Configuration
# Default monitoring interval in seconds
MONITORING_INTERVAL="300"

# Security Thresholds
# Maximum number of violations before failing validation
MAX_VIOLATIONS="0"

# Maximum number of warnings before flagging
MAX_WARNINGS="5"

# Report Configuration
# Directory for security reports
REPORT_DIR="security-reports"

# Log retention in days
LOG_RETENTION_DAYS="30"

# Network Security Configuration
# Check for external network access
CHECK_EXTERNAL_ACCESS="true"

# Check for unexpected port bindings
CHECK_PORT_BINDINGS="true"

# Check for network isolation
CHECK_NETWORK_ISOLATION="true"

# File System Security Configuration
# Check file permissions
CHECK_FILE_PERMISSIONS="true"

# Check mount options
CHECK_MOUNT_OPTIONS="true"

# Check write access restrictions
CHECK_WRITE_ACCESS="true"

# Check file type restrictions (Phase 5.5)
CHECK_FILE_TYPE_RESTRICTIONS="true"

# Container Security Configuration
# Check for root user execution
CHECK_ROOT_USER="true"

# Check security options
CHECK_SECURITY_OPTIONS="true"

# Check resource limits
CHECK_RESOURCE_LIMITS="true"

# Check read-only filesystem
CHECK_READONLY_FS="true"

# Encryption Configuration
# Check for secret keys
CHECK_SECRET_KEYS="true"

# Check for JWT configuration
CHECK_JWT_CONFIG="true"

# Check for encryption settings
CHECK_ENCRYPTION_SETTINGS="true"

# Monitoring Configuration
# Enable network traffic monitoring
ENABLE_NETWORK_MONITORING="true"

# Enable file access monitoring
ENABLE_FILE_MONITORING="true"

# Enable container monitoring
ENABLE_CONTAINER_MONITORING="true"

# Monitoring intervals (seconds)
NETWORK_MONITOR_INTERVAL="30"
FILE_MONITOR_INTERVAL="10"
CONTAINER_MONITOR_INTERVAL="60"

# Alert Configuration
# Enable security alerts
ENABLE_ALERTS="true"

# Alert threshold for violations
ALERT_VIOLATION_THRESHOLD="1"

# Alert threshold for warnings
ALERT_WARNING_THRESHOLD="5"

# Alert methods (log, email, webhook)
ALERT_METHODS="log"

# Email configuration (if using email alerts)
ALERT_EMAIL=""
SMTP_SERVER=""
SMTP_PORT="587"
SMTP_USER=""
SMTP_PASS=""

# Webhook configuration (if using webhook alerts)
WEBHOOK_URL=""
WEBHOOK_HEADERS=""

# Compliance Configuration
# Enable compliance checking
ENABLE_COMPLIANCE_CHECK="true"

# Compliance standards to check against
COMPLIANCE_STANDARDS="basic,security,isolation"

# Security Policy Configuration
# Strict mode - fail on any violation
STRICT_MODE="true"

# Allow warnings in strict mode
ALLOW_WARNINGS_IN_STRICT="true"

# Auto-fix minor issues
AUTO_FIX_ISSUES="false"

# Backup before fixes
BACKUP_BEFORE_FIX="true"

# Performance Configuration
# Maximum concurrent checks
MAX_CONCURRENT_CHECKS="4"

# Check timeout in seconds
CHECK_TIMEOUT="30"

# Retry failed checks
RETRY_FAILED_CHECKS="true"

# Maximum retries
MAX_RETRIES="3"

# Retry delay in seconds
RETRY_DELAY="5"

# Advanced Configuration
# Enable detailed logging
ENABLE_DETAILED_LOGGING="true"

# Enable performance metrics
ENABLE_PERFORMANCE_METRICS="true"

# Enable security metrics
ENABLE_SECURITY_METRICS="true"

# Metrics collection interval
METRICS_INTERVAL="60"

# Database configuration (if using database for reports)
USE_DATABASE="false"
DATABASE_URL=""
DATABASE_TYPE="sqlite"

# API configuration (if exposing validation API)
ENABLE_API="false"
API_PORT="8080"
API_HOST="127.0.0.1"

# Authentication for API
API_AUTH_REQUIRED="true"
API_TOKEN=""

# Rate limiting
API_RATE_LIMIT="100"
API_RATE_WINDOW="3600"

# Custom validation rules
# Path to custom validation script
CUSTOM_VALIDATION_SCRIPT=""

# Custom validation timeout
CUSTOM_VALIDATION_TIMEOUT="60"

# Custom validation enabled
CUSTOM_VALIDATION_ENABLED="false"

# Integration Configuration
# Docker integration
DOCKER_INTEGRATION="true"

# Docker socket path
DOCKER_SOCKET="/var/run/docker.sock"

# Docker API version
DOCKER_API_VERSION="1.40"

# System integration
SYSTEM_INTEGRATION="true"

# System commands to use
NETSTAT_CMD="netstat"
DOCKER_CMD="docker"
STAT_CMD="stat"
MOUNT_CMD="mount"

# Platform-specific settings
# macOS specific
if [[ "$OSTYPE" == "darwin"* ]]; then
    NETSTAT_CMD="netstat"
    STAT_CMD="stat"
    MOUNT_CMD="mount"
fi

# Linux specific
if [[ "$OSTYPE" == "linux-gnu"* ]]; then
    NETSTAT_CMD="netstat"
    STAT_CMD="stat"
    MOUNT_CMD="mount"
fi

# Validation Rules
# Network validation rules
NETWORK_RULES=(
    "localhost_only_binding"
    "no_external_access"
    "isolated_network"
    "secure_port_binding"
)

# File system validation rules
FILESYSTEM_RULES=(
    "proper_permissions"
    "readonly_mount"
    "file_type_restrictions"
    "path_validation"
    "content_validation"
)

# Container validation rules
CONTAINER_RULES=(
    "non_root_user"
    "security_options"
    "resource_limits"
    "readonly_filesystem"
    "capability_restrictions"
)

# Encryption validation rules
ENCRYPTION_RULES=(
    "secret_keys_present"
    "jwt_configuration"
    "encryption_enabled"
    "secure_communication"
)

# Compliance rules
COMPLIANCE_RULES=(
    "security_standards"
    "isolation_requirements"
    "access_control"
    "audit_logging"
    "monitoring_enabled"
)
