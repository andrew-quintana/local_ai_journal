# Docker Compose Configuration for Journals Infrastructure
# 
# This configuration provides secure Docker orchestration for AI services
# with localhost-only binding and read-only journal access.
#
# Security Features:
# - All services bound to localhost only (127.0.0.1)
# - Journal directory mounted read-only
# - Isolated Docker network
# - No external network access
# - Minimal container privileges
#
# Author: Local Development Team
# Version: 1.0
# Date: 2025-01-18

# Docker Compose Configuration for Journals Infrastructure
# Version 3.8 (version field removed for compatibility)

# Network configuration for service isolation
networks:
  journals-internal:
    driver: bridge
    internal: false  # Allow external network access for port binding
    name: journals-internal

# Volume configuration for secure data access
volumes:
  ollama-data:
    driver: local
    name: journals-ollama-data
    
  webui-data:
    driver: local
    name: journals-webui-data
    
  journals-data:
    driver: local
    name: journals-data

# Service definitions
services:
  # Ollama AI Model Server
  ollama:
    image: ollama/ollama:latest
    container_name: journals-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"  # Port mapping
    volumes:
      - ollama-data:/root/.ollama
      - journals-data:/journals:rw  # Read-write journal access for markdown files
    networks:
      - journals-internal
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    security_opt:
      - no-new-privileges:true
    read_only: false  # Ollama needs write access for model storage
    tmpfs:
      - /tmp:noexec,nosuid,size=1g
    user: "1000:1000"  # Non-root user
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID

  # Vault File Server
  vault-server:
    image: python:3.11-slim
    container_name: journals-vault-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"  # Localhost only binding
    volumes:
      - journals-data:/journals:ro  # Read-only access to vault files
      - ./vault-file-server.py:/app/vault-file-server.py:ro
    networks:
      - journals-internal
    command: ["python", "/app/vault-file-server.py"]
    environment:
      - PORT=8081
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/files"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MCP Server for Vault Access
  mcp-server:
    image: python:3.11-slim
    container_name: journals-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"  # Localhost only binding
    volumes:
      - journals-data:/journals:rw  # Read-write access for MCP tools
      - ../mcp/vault-mcp-server.py:/app/vault-mcp-server.py:ro
      - ../mcp/mcp-server.conf:/app/mcp-server.conf:ro
    networks:
      - journals-internal
    command: ["python", "/app/vault-mcp-server.py"]
    environment:
      - VAULT_PATH=/journals
      - MCP_SERVER_PORT=8082
      - MCP_SERVER_HOST=0.0.0.0
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8082)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    read_only: false  # MCP server needs write access for journal operations
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    user: "1000:1000"  # Non-root user
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID

  # Open WebUI Interface
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: journals-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"  # Localhost only binding
    volumes:
      - journals-data:/journals:rw  # Read-write journal access for markdown files
      - webui-data:/app/backend/data  # Persistent WebUI data
      - ./vault-integration.js:/app/static/vault-integration.js:ro  # Vault integration script
    networks:
      - journals-internal
    environment:
      # Core WebUI Configuration
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-TQ8wmRWLlIVhelwyM1tdHJkN1cpbrFNqxBsUn7kbJM0=}
      - WEBUI_JWT_SECRET_KEY=${WEBUI_JWT_SECRET_KEY:-kzIdNaWu8WsNF4oXP54QNC+k0JF4EGVu+bT2UzpkNsw=}
      
      # Security Configuration - No Authentication for Local Single-User System
      - ENABLE_SIGNUP=false  # Disable user registration
      - ENABLE_LOGIN_FORM=false  # Disable login form
      - ENABLE_OAUTH_SIGNUP=false
      - WEBUI_DISABLE_SIGNUP=true
      - WEBUI_DISABLE_LOGIN_FORM=true  # Disable login form
      - WEBUI_AUTH=false  # Disable authentication entirely
      - ENABLE_AUTH=false  # Disable authentication entirely
      
      # Disable all external API integrations
      - ENABLE_OPENAI_API=false
      - ENABLE_ANTHROPIC_API=false
      - ENABLE_GOOGLE_API=false
      - ENABLE_COHERE_API=false
      - ENABLE_AZURE_OPENAI_API=false
      - ENABLE_OPENROUTER_API=false
      - ENABLE_TABBY_API=false
      
      # Disable external features
      - ENABLE_LOCAL_WEB_SEARCH=false
      - ENABLE_COMMUNITY_SHARING=false
      - ENABLE_MESSAGE_RATING=false
      
      # Disable admin features for security
      - ENABLE_ADMIN_EXPORT=false
      - ENABLE_ADMIN_CHAT_ACCESS=false
      - ENABLE_ADMIN_USER_MANAGEMENT=false
      - ENABLE_ADMIN_MODEL_MANAGEMENT=false
      - ENABLE_ADMIN_SYSTEM_MONITORING=false
      - ENABLE_ADMIN_ANNOUNCEMENTS=false
      
      # Disable rich text features to reduce attack surface
      - ENABLE_ADMIN_ANNOUNCEMENTS_RICH_TEXT=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_MARKDOWN=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_CODE_HIGHLIGHTING=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_MATH=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_MERMAID=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_DIAGRAMS=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_TABLES=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_TASKLISTS=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_STRIKETHROUGH=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_FOOTNOTES=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_DEFINITION_LISTS=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_ABBREVIATIONS=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_SUBSCRIPTS=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_SUPERSCRIPTS=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_QUOTES=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_SMARTYPANTS=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_TYPOGRAPHER=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_ATTRIBUTES=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_CONTAINERS=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_ALERTS=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_ICONS=false
      - ENABLE_ADMIN_ANNOUNCEMENTS_EMOJI=false
      
      # Network Security
      - WEBUI_HOST=0.0.0.0
      - WEBUI_PORT=8080
      - WEBUI_ORIGINS=http://127.0.0.1:${WEBUI_PORT:-3000}
      - CORS_ALLOW_ORIGIN=http://127.0.0.1:${WEBUI_PORT:-3000}
      
      # File Upload and Document Management
      - ENABLE_FILE_UPLOAD=true
      - MAX_FILE_SIZE=10485760  # 10MB max file size
      - ENABLE_DOCUMENT_UPLOAD=true
      - ENABLE_DOCUMENT_MANAGEMENT=true
      
      # Session Security
      - SESSION_TIMEOUT=3600
      - JWT_EXPIRATION=3600
      
      # Logging Security
      - LOG_LEVEL=WARNING
      - ENABLE_DEBUG=false
      
      # Markdown Write Access Configuration
      - WEBUI_JOURNAL_READ_ONLY=false
      - WEBUI_JOURNAL_WRITE_ENABLED=true
      - WEBUI_JOURNAL_ALLOWED_EXTENSIONS=md,markdown,txt
      - WEBUI_JOURNAL_WRITE_MONITORING=true
      - WEBUI_JOURNAL_BACKUP_ENABLED=true
      
      # Document and File Management
      - ENABLE_DOCUMENT_VIEWER=true
      - ENABLE_FILE_BROWSER=true
      - ENABLE_DOCUMENT_SEARCH=true
      - ENABLE_MARKDOWN_EDITOR=true
      - ENABLE_TEMPLATE_MANAGEMENT=true
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    # read_only: true  # Temporarily disabled for testing
    tmpfs:
      - /tmp:noexec,nosuid,size=512m
      - /var/tmp:noexec,nosuid,size=256m
    # user: "1000:1000"  # Non-root user - temporarily disabled for testing
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
    sysctls:
      - net.core.somaxconn=1024
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
